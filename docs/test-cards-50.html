<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VisiScan 50 Test Cards</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Inter:wght@400;600;800&family=Noto+Sans+Devanagari:wght@400;700&family=Space+Mono:wght@400;700&family=Poppins:wght@500;700;800&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; }
  body { background:#2a2a2e; color:#eee; font-family:Inter,system-ui,sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; }
  .bar { position:sticky; top:0; z-index:2; width:100%; display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center; padding:12px 16px; background:#1c1c1f; font-size:14px; }
  .bar button, .bar label { background:#3a3a40; color:#eee; border:0; border-radius:8px; padding:9px 13px; font:inherit; cursor:pointer; }
  .bar button.big { background:#f08a6c; color:#231c2e; font-weight:800; padding:9px 22px; }
  .bar label { display:flex; gap:6px; align-items:center; }
  .bar .count { opacity:.8; min-width:110px; text-align:center; font-weight:600; }
  .stage { flex:1; display:flex; flex-wrap:wrap; gap:48px; align-items:center; justify-content:center; width:100%; padding:40px 24px; }
  .slot { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .slot > span { font-size:12px; letter-spacing:.14em; text-transform:uppercase; opacity:.55; }
  .card { width:min(560px, 44vw); aspect-ratio:3.5/2; border-radius:10px; position:relative; overflow:hidden; box-shadow:0 20px 50px rgba(0,0,0,.5); transition:transform .3s, filter .3s; font-size:min(12px, 1.6vw); padding:5.5% 6%; }
  @media (max-width: 900px) { .card { width:92vw; font-size:2.1vw; } .stage { gap:28px; } }
  .stage.tilt .slot:first-child .card { transform:perspective(900px) rotateX(18deg) rotateZ(-7deg); }
  .stage.tilt .slot:last-child .card { transform:perspective(900px) rotateX(-14deg) rotateZ(6deg); }
  .stage.dim .card { filter:brightness(.42) contrast(.8); }
  .stage.blur .card { filter:blur(1.4px); }
  .stage.dim.blur .card { filter:brightness(.42) contrast(.8) blur(1.4px); }
  .stage.glare .card::after { content:''; position:absolute; inset:0; background:radial-gradient(circle at 70% 25%, rgba(255,255,255,.75), transparent 45%); pointer-events:none; }
  .stage.glare .slot:last-child .card::after { background:radial-gradient(circle at 25% 70%, rgba(255,255,255,.7), transparent 42%); }
  .blank { display:grid; place-items:center; height:100%; opacity:.25; font-size:.9em; letter-spacing:.2em; }
  .hint { opacity:.6; font-size:13px; padding:0 16px 20px; text-align:center; max-width:900px; }
  .row { display:flex; justify-content:space-between; gap:4%; height:100%; }
  .col { display:flex; flex-direction:column; justify-content:space-between; }
  small { font-size:.78em; }
</style>
</head>
<body>
<div class="bar">
  <button id="prev">◀ Prev</button>
  <span class="count" id="count"></span>
  <button id="next" class="big">Next ▶</button>
  <label><input type="checkbox" data-mode="dim" checked> Dark room</label>
  <label><input type="checkbox" data-mode="tilt" checked> Bad angle</label>
  <label><input type="checkbox" data-mode="blur" checked> Shaky</label>
  <label><input type="checkbox" data-mode="glare" checked> Glare</label>
</div>
<div class="stage dim tilt blur glare" id="stage"></div>
<p class="hint">50 fictional businesses for testing only. Front on the left, back on the right: scan front, then back, press → (or Space) for the next card. All filters start on; untick to make it easier. Cards with a blank back say so: use "Back is blank — skip".</p>

<script>
// Seeded PRNG so every reload shows the same 50 cards
let seed = 20261017;
const rnd = () => ((seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648);
const pick = (a) => a[Math.floor(rnd() * a.length)];
const num = (n) => Array.from({ length: n }, () => Math.floor(rnd() * 10)).join('');
const mobile = () => `+91 ${pick(['98', '97', '99', '96', '88', '87', '70', '63', '91', '81'])}${num(3)} ${num(5)}`;
const PAN = 'ABCDEFGHJKLMNPRSTUVWXYZ';
const gst = (state) => `${state}${Array.from({ length: 5 }, () => pick(PAN.split(''))).join('')}${num(4)}${pick(PAN.split(''))}1Z${pick(['5', '8', 'Q', 'X', '2'])}`;

const biz = [
  ['Krishna Auto Spares', 'Two-wheeler & car spare parts', 'auto'], ['Lotus Dental Clinic', 'Root canal • Implants • Braces', 'clinic'],
  ['Shiv Shakti Steel Traders', 'TMT bars • Angles • Channels', 'steel'], ['Pinewood Interiors', 'Modular kitchens & wardrobes', 'interior'],
  ['Annapurna Caterers', 'Weddings • Corporate • Parties', 'food'], ['Vardhman Pharma Distributors', 'Wholesale medicines & surgicals', 'pharma'],
  ['BlueOrbit Technologies', 'Web • Apps • Cloud', 'tech'], ['Gupta & Sons Jewellers', 'Hallmarked gold & diamond', 'jewel'],
  ['Sai Ram Packers & Movers', 'Household & office shifting', 'logistics'], ['GreenLeaf Organics', 'Farm-fresh organic produce', 'food'],
  ['Om Sai Electricals', 'Wiring • Panels • Solar', 'electric'], ['Royal Enfield Service Point', 'Authorised service & spares', 'auto'],
  ['Nimbus Tours & Travels', 'Flights • Hotels • Packages', 'travel'], ['Sunrise Printing Press', 'Offset • Digital • Flex', 'print'],
  ['Mahalaxmi Textiles', 'Sarees • Suiting • Shirting', 'textile'], ['Precision CNC Works', 'CNC turning & milling job work', 'steel'],
  ['Aarogya Diagnostics', 'Pathology • X-Ray • ECG', 'clinic'], ['Urban Brew Café', 'Coffee • Bakes • Brunch', 'food'],
  ['Kaveri Hardware & Paints', 'Asian Paints dealer', 'hardware'], ['Bharat Agro Implements', 'Tractor parts & farm tools', 'agri'],
  ['Pixel Perfect Studio', 'Wedding & product photography', 'print'], ['Shree Balaji Cement Agency', 'UltraTech • ACC • Ambuja', 'hardware'],
  ['Metro Legal Associates', 'Advocates & legal consultants', 'legal'], ['Swastik Plywood House', 'Plywood • Laminates • Veneers', 'interior'],
  ['CoolAir Refrigeration', 'AC sales, service & AMC', 'electric'], ['Tanvi Boutique', 'Designer lehengas & bridal wear', 'textile'],
  ['Saraswati Book Depot', 'School books & stationery', 'print'], ['IronCore Fitness', 'Gym • CrossFit • Yoga', 'fitness'],
  ['Hindustan Plastics', 'HDPE & PVC moulded products', 'steel'], ['DataNest Solutions', 'Tally • ERP • GST software', 'tech'],
  ['Ganga Sweets & Namkeen', 'Pure desi ghee sweets', 'food'], ['SafeHands Security Services', 'Guards • CCTV • Facility', 'legal'],
  ['Ruchi Spices', 'Whole & ground masala exporters', 'agri'], ['Vishwakarma Furniture', 'Sofa • Beds • Office furniture', 'interior'],
  ['Apex Chartered Accountants', 'Audit • Tax • GST filing', 'legal'], ['Neelkanth Motors', 'Pre-owned cars, finance available', 'auto'],
  ['Little Steps Play School', 'Playgroup • Nursery • Daycare', 'edu'], ['Bright Future Coaching', 'JEE • NEET • Foundation', 'edu'],
  ['Prakash Opticals', 'Eye testing • Frames • Lenses', 'clinic'], ['Shubh Laxmi Event Planners', 'Décor • Sound • Lights', 'travel'],
  ['Everest Tiles & Sanitary', 'Kajaria • Jaquar • Cera', 'hardware'], ['Mohan Dairy Farm', 'Milk • Paneer • Ghee', 'agri'],
  ['Spark Digital Marketing', 'SEO • Ads • Social media', 'tech'], ['Raghav Courier Services', 'Domestic & international', 'logistics'],
  ['Jai Ambe Fabricators', 'MS & SS fabrication, gates, grills', 'steel'], ['Fresh Fold Laundry', 'Dry clean • Steam iron • Pickup', 'logistics'],
  ['Divine Ayurveda Kendra', 'Panchakarma & herbal therapy', 'clinic'], ['Northstar Realty', 'Plots • Flats • Commercial', 'legal'],
  ['Kalpana Beauty Parlour', 'Bridal makeup • Hair • Skin', 'fitness'], ['Trimurti Transport Co.', 'Full truck load across India', 'logistics'],
];
const hindi = { 4: 'अन्नपूर्णा केटरर्स', 14: 'महालक्ष्मी टेक्सटाइल्स', 21: 'श्री बालाजी सीमेंट एजेंसी', 30: 'गंगा स्वीट्स एवं नमकीन', 41: 'मोहन डेयरी फार्म', 49: 'त्रिमूर्ति ट्रांसपोर्ट कं.' };
const first = ['Rajesh', 'Priya', 'Amit', 'Sneha', 'Vikram', 'Anjali', 'Suresh', 'Kavita', 'Manoj', 'Pooja', 'Arjun', 'Neha', 'Deepak', 'Ritu', 'Sanjay', 'Meera', 'Harish', 'Swati', 'Nitin', 'Farhan', 'Gurpreet', 'Lakshmi', 'Joseph', 'Ayesha'];
const last = ['Sharma', 'Verma', 'Gupta', 'Agarwal', 'Patel', 'Iyer', 'Reddy', 'Singh', 'Khan', 'Mehta', 'Joshi', 'Nair', 'Chopra', 'Bansal', 'Malhotra', 'Desai', 'Kulkarni', 'Fernandes', 'Saxena', 'Bhatia'];
const roles = ['Proprietor', 'Managing Director', 'Partner', 'Sales Manager', 'Director', 'Founder & CEO', 'Business Development', 'Branch Manager', 'Chief Consultant', 'Owner'];
const places = [
  ['Shop 12, Main Bazaar', 'Paharganj, New Delhi 110055', '07', 'Delhi'], ['Plot 45, MIDC Bhosari', 'Pune, Maharashtra 411026', '27', 'Pune'],
  ['2nd Floor, Brigade Arcade', 'Koramangala, Bengaluru 560034', '29', 'Bengaluru'], ['G-7, Navrangpura', 'Ahmedabad, Gujarat 380009', '24', 'Ahmedabad'],
  ['No. 18, Anna Salai', 'Chennai, Tamil Nadu 600002', '33', 'Chennai'], ['SCO 112, Sector 17-C', 'Chandigarh 160017', '04', 'Chandigarh'],
  ['B-204, Raja Park', 'Jaipur, Rajasthan 302004', '08', 'Jaipur'], ['Hazratganj Market', 'Lucknow, Uttar Pradesh 226001', '09', 'Lucknow'],
  ['8-2-293, Road No. 12, Banjara Hills', 'Hyderabad, Telangana 500034', '36', 'Hyderabad'], ['14 Park Street', 'Kolkata, West Bengal 700016', '19', 'Kolkata'],
  ['Unit 5, Andheri Industrial Estate', 'Andheri (E), Mumbai 400093', '27', 'Mumbai'], ['Near Bus Stand, Civil Lines', 'Nagpur, Maharashtra 440001', '27', 'Nagpur'],
];
const palettes = [
  { bg: '#ffffff', fg: '#1d2a44', ac: '#b23a1e' }, { bg: 'linear-gradient(135deg,#0f2027,#2c5364)', fg: '#e8f1f5', ac: '#7fd1ff' },
  { bg: '#fdf6e3', fg: '#3b2f1e', ac: '#b8860b' }, { bg: 'linear-gradient(120deg,#1a1a1a,#3a3a3a)', fg: '#f5f5f5', ac: '#e8c66a' },
  { bg: '#eef7f0', fg: '#163a24', ac: '#2e8b57' }, { bg: 'linear-gradient(135deg,#fff1eb,#ace0f9)', fg: '#1f2d3d', ac: '#d6336c' },
  { bg: '#f4f0ff', fg: '#2b1d52', ac: '#6c4ad6' }, { bg: '#7a0e1e', fg: '#fff3e6', ac: '#ffcf70' },
  { bg: '#ffffff', fg: '#222', ac: '#0a66c2' }, { bg: 'linear-gradient(160deg,#fceabb,#f8b500)', fg: '#3a2500', ac: '#7a1f00' },
];
const fonts = [["'Playfair Display'", 'Inter'], ['Poppins', 'Poppins'], ["'Libre Baskerville'", 'Inter'], ['Inter', 'Inter'], ["'Space Mono'", "'Space Mono'"]];
const services = {
  auto: ['Engine overhaul', 'Genuine spares', 'Denting & painting', 'Insurance claims'], clinic: ['Mon–Sat 10am–8pm', 'Sunday by appointment', 'All insurance accepted', 'Home sample collection'],
  steel: ['Bulk orders welcome', 'Same-day dispatch', 'ISI marked material', 'Cutting to size'], interior: ['Free site visit', '3D design', '10-year warranty', 'Turnkey projects'],
  food: ['Min. order 50 plates', 'Veg & Jain menus', 'FSSAI Lic. 1002201900' + '4417', 'Free tasting'], pharma: ['24×7 emergency supply', 'Cold chain', 'Drug Lic. DL-20B/1187', 'Hospital supplies'],
  tech: ['24×7 support', 'AWS & Azure partner', 'ISO 27001', 'Free consultation'], jewel: ['BIS hallmark', 'Old gold exchange', 'Custom designs', 'Easy EMI'],
  logistics: ['Pan-India network', 'Insured transit', 'GPS tracking', 'Doorstep pickup'], electric: ['Licensed contractor', 'AMC available', 'Solar subsidy help', '1-year warranty'],
  travel: ['Visa assistance', 'Group tours', 'Corporate travel', '24×7 helpline'], print: ['Same-day delivery', 'Bulk rates', 'Design support', 'Free pickup & drop'],
  textile: ['Wholesale & retail', 'Custom tailoring', 'Export quality', 'Bridal collection'], hardware: ['Authorised dealer', 'Free home delivery', 'Bulk discounts', 'Colour consultation'],
  agri: ['Farmer discounts', 'Export quality', 'Govt. approved', 'Doorstep delivery'], legal: ['Free first consultation', 'Pan-India', 'Confidential', 'Online appointments'],
  edu: ['Small batches', 'Weekly tests', 'Transport available', 'Admissions open'], fitness: ['Certified trainers', 'Ladies batch', 'Diet plans', 'Free trial session'],
};

const cards = biz.map(([name, tagline, kind], i) => {
  const p = palettes[i % palettes.length];
  const [hf, bf] = fonts[(i * 3) % fonts.length];
  const place = pick(places);
  const person = `${pick(first)} ${pick(last)}`;
  const role = pick(roles);
  const slug = name.toLowerCase().replace(/[^a-z]+/g, '').slice(0, 14);
  const mobiles = Array.from({ length: 1 + Math.floor(rnd() * 3) }, mobile);
  const land = rnd() < 0.45 ? `${pick(['011', '020', '080', '079', '044', '022', '0172', '0141'])}-${num(4)} ${num(4)}` : null;
  const email = rnd() < 0.85 ? `${pick(['info', 'sales', 'contact', person.split(' ')[0].toLowerCase()])}@${slug}.${pick(['in', 'com', 'co.in'])}` : null;
  const web = rnd() < 0.6 ? `www.${slug}.${pick(['in', 'com', 'co.in'])}` : null;
  const gstin = rnd() < 0.7 ? gst(place[2]) : null;
  const hi = hindi[i];
  const nameHtml = hi
    ? `<div style="font-family:'Noto Sans Devanagari';font-weight:700;font-size:2.1em;line-height:1.1;color:${p.ac}">${hi}</div><div style="font-weight:800;font-size:1.15em;margin-top:.2em">${name.toUpperCase()}</div>`
    : `<div style="font-family:${hf};font-weight:800;font-size:2.1em;line-height:1.05;color:${p.ac}">${name}</div>`;
  const contact = `
    <div>${mobiles.map((m) => `📞 ${m}`).join('<br>')}${land ? `<br>☎ ${land}` : ''}</div>
    ${email || web ? `<div>${[email, web].filter(Boolean).join('<br>')}</div>` : ''}
    <div>${place[0]},<br>${place[1]}</div>
    ${gstin ? `<small style="opacity:.7">GSTIN: ${gstin}</small>` : ''}`;
  const layout = i % 4;
  let front;
  if (layout === 0)
    front = `<div class="row"><div class="col" style="width:56%"><div>${nameHtml}<div style="margin-top:.5em;font-size:.85em;letter-spacing:.1em;text-transform:uppercase;opacity:.7">${tagline}</div></div>
      <div><div style="font-weight:800;font-size:1.25em">${person}</div><div style="opacity:.75">${role}</div></div></div>
      <div class="col" style="width:44%;text-align:right;font-size:.92em;line-height:1.55">${contact}</div></div>`;
  else if (layout === 1)
    front = `<div class="col" style="height:100%"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div>${nameHtml}<div style="opacity:.75;margin-top:.3em">${tagline}</div></div>
      <div style="width:3.2em;height:3.2em;border-radius:50%;background:${p.ac};opacity:.85"></div></div>
      <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:4%;font-size:.9em;line-height:1.5"><div><div style="font-weight:800;font-size:1.3em">${person}</div><div style="opacity:.75;margin-bottom:.6em">${role}</div>${contact.replace(/<small[^>]*>.*?<\/small>/, '')}</div>
      ${gstin ? `<small style="opacity:.7;writing-mode:vertical-rl;transform:rotate(180deg)">GSTIN ${gstin}</small>` : ''}</div></div>`;
  else if (layout === 2)
    front = `<div class="col" style="height:100%;align-items:center;text-align:center;justify-content:center;gap:.7em">${nameHtml}<div style="letter-spacing:.2em;text-transform:uppercase;font-size:.8em;opacity:.7">${tagline}</div>
      <div style="width:30%;height:2px;background:${p.ac}"></div><div><b style="font-size:1.2em">${person}</b> · ${role}</div>
      <div style="font-size:.9em;line-height:1.5">${mobiles.join(' / ')}${land ? ` / ${land}` : ''}<br>${[email, web].filter(Boolean).join(' • ')}</div></div>`;
  else
    front = `<div class="row"><div style="width:34%;background:${p.ac};margin:-6.25% 0 -6.25% -6.8%;padding:6%;display:flex;flex-direction:column;justify-content:center;color:${p.bg.startsWith('#') ? p.bg : '#fff'}">
      <div style="font-weight:800;font-size:1.3em">${person}</div><div style="opacity:.85">${role}</div></div>
      <div class="col" style="width:62%;font-size:.92em;line-height:1.5">${nameHtml}<div style="opacity:.7">${tagline}</div>${contact}</div></div>`;

  // back: every 7th blank; otherwise branch, services, Hindi, bank/extra numbers
  const bk = i % 7 === 6 ? 'blank' : pick(['branch', 'services', 'services', 'extra', hi ? 'hindi' : 'branch']);
  const branch = pick(places.filter((x) => x !== place));
  let back;
  if (bk === 'blank') back = `<div class="blank">(blank back)</div>`;
  else if (bk === 'branch')
    back = `<div class="col" style="height:100%;justify-content:center;text-align:center;gap:.9em"><div style="font-family:${hf};font-weight:800;font-size:1.6em;color:${p.ac}">${branch[3]} Branch</div>
      <div style="font-size:1.1em;line-height:1.6">${branch[0]},<br>${branch[1]}</div><div>Branch: ${mobile()}</div><small style="opacity:.6">${services[kind].slice(0, 3).join(' • ')}</small></div>`;
  else if (bk === 'services')
    back = `<div class="col" style="height:100%;justify-content:center;gap:.5em;font-size:1.05em"><div style="font-family:${hf};font-weight:800;font-size:1.4em;color:${p.ac};margin-bottom:.3em">Our Services</div>
      ${services[kind].map((s) => `<div>✓ ${s}</div>`).join('')}<small style="opacity:.6;margin-top:.6em">${web || email || ''}</small></div>`;
  else if (bk === 'extra')
    back = `<div class="col" style="height:100%;justify-content:center;gap:.5em;line-height:1.5"><div style="font-weight:800;font-size:1.2em;color:${p.ac}">Also reach us</div>
      <div>WhatsApp: ${mobile()}</div><div>Accounts: ${mobile()}</div>${land ? '' : `<div>Office: 0${pick(['11', '20', '80', '22'])}-${num(4)} ${num(4)}</div>`}
      <small style="opacity:.7;margin-top:.5em">Bank: ${pick(['HDFC', 'SBI', 'ICICI', 'Axis'])} Bank · A/c ${num(4)} ${num(4)} ${num(4)} · IFSC ${pick(['HDFC', 'SBIN', 'ICIC', 'UTIB'])}0${num(6)}</small></div>`;
  else
    back = `<div class="col" style="height:100%;justify-content:center;text-align:center;gap:.8em;font-family:'Noto Sans Devanagari'"><div style="font-weight:700;font-size:1.6em;color:${p.ac}">${hi}</div>
      <div style="font-size:1.1em">संपर्क करें: ${mobiles[0]}</div><div>${place[3]} में सर्वश्रेष्ठ सेवा</div><small style="opacity:.6">थोक एवं खुदरा विक्रेता</small></div>`;

  return { style: `background:${p.bg};color:${p.fg};font-family:${bf}`, front, back };
});

let i = 0;
const stage = document.getElementById('stage');
function render() {
  const c = cards[i];
  stage.innerHTML = `<div class="slot"><span>Front</span><div class="card" style="${c.style}">${c.front}</div></div>
    <div class="slot"><span>Back</span><div class="card" style="${c.style}">${c.back}</div></div>`;
  document.getElementById('count').textContent = `Card ${i + 1} / ${cards.length}`;
}
const go = (d) => { i = (i + d + cards.length) % cards.length; render(); };
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go(1); }
  if (e.key === 'ArrowLeft') go(-1);
});
document.querySelectorAll('[data-mode]').forEach((cb) => (cb.onchange = () => stage.classList.toggle(cb.dataset.mode, cb.checked)));
render();
</script>
</body>
</html>
