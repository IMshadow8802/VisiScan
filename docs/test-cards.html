<style>
  :root { --bg:#2a2a2e; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:#eee; font-family:Inter,system-ui,sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; }
  .bar { width:100%; display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center; padding:14px 16px; background:#1c1c1f; font-size:14px; }
  .bar button, .bar label { background:#3a3a40; color:#eee; border:0; border-radius:8px; padding:8px 12px; font:inherit; cursor:pointer; }
  .bar label { display:flex; gap:6px; align-items:center; }
  .bar .count { opacity:.7; min-width:90px; text-align:center; }
  .stage { flex:1; display:grid; place-items:center; width:100%; padding:40px 16px; }
  .card { width:min(760px, 92vw); aspect-ratio:3.5/2; border-radius:10px; position:relative; overflow:hidden; box-shadow:0 20px 50px rgba(0,0,0,.5); transition:transform .3s, filter .3s; font-size:min(16px, 2.1vw); }
  .card.tilt { transform:perspective(900px) rotateX(18deg) rotateZ(-7deg); }
  .card.dim { filter:brightness(.42) contrast(.8); }
  .card.blur { filter:blur(1.4px); }
  .card.dim.blur { filter:brightness(.42) contrast(.8) blur(1.4px); }
  .glare::after { content:''; position:absolute; inset:0; background:radial-gradient(circle at 70% 25%, rgba(255,255,255,.75), transparent 45%); pointer-events:none; }
  .side { position:absolute; inset:0; padding:5.5% 6%; display:none; }
  .show-front .front, .show-back .back { display:block; }
  .hint { opacity:.6; font-size:13px; padding:0 16px 20px; text-align:center; max-width:760px; }
  .row { display:flex; justify-content:space-between; gap:4%; height:100%; }
  .col { display:flex; flex-direction:column; justify-content:space-between; }
  small { font-size:.78em; }
</style>

<div class="bar">

  <span class="count" id="count"></span>
  <button id="next">Next ▶</button>
  <button id="flip">Flip (front/back)</button>
  <label><input type="checkbox" data-mode="dim"> Dark room</label>
  <label><input type="checkbox" data-mode="tilt"> Bad angle</label>
  <label><input type="checkbox" data-mode="blur"> Shaky</label>
  <label><input type="checkbox" data-mode="glare"> Glare</label>
</div>
<div class="stage"><div class="card show-front" id="card"></div></div>

let i = 0, back = false;
const el = document.getElementById('card');
function render() {
  const c = cards[i];
  el.style.cssText = c.style;
  el.innerHTML = `<div class="side front">${c.front}</div><div class="side back">${c.back}</div>`;
  el.classList.toggle('show-front', !back);
  el.classList.toggle('show-back', back);
  document.getElementById('count').textContent = `Card ${i + 1} / ${cards.length} · ${back ? 'BACK' : 'FRONT'}`;
}
const go = (d) => { i = (i + d + cards.length) % cards.length; back = false; render(); };
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
document.getElementById('flip').onclick = () => { back = !back; render(); };
document.querySelectorAll('[data-mode]').forEach((cb) => cb.onchange = () => el.classList.toggle(cb.dataset.mode, cb.checked));
addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') go(1);
  if (e.key === 'ArrowLeft') go(-1);
  if (e.key.toLowerCase() === 'f') { back = !back; render(); }
});
render();
</script>
