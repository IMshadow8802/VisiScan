<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Single-colour silhouette of mark.svg for Android themed icons (only alpha is used). -->
  <defs>
    <rect id="c" x="-260" y="-160" width="520" height="320" rx="48"/>
    <mask id="m">
      <use href="#c" transform="translate(478 432) rotate(-14)" fill="#fff"/>
      <use href="#c" transform="translate(520 500) rotate(-3)" fill="#fff" stroke="#000" stroke-width="28"/>
      <g transform="translate(560 590) rotate(7)" fill="#000">
        <use href="#c" fill="#fff" stroke="#000" stroke-width="28"/>
        <rect x="-200" y="-100" width="120" height="20" rx="10"/>
        <rect x="-200" y="-56" width="260" height="38" rx="19"/>
        <rect x="-200" y="54" width="190" height="18" rx="9"/>
        <rect x="-200" y="88" width="140" height="18" rx="9"/>
      </g>
    </mask>
  </defs>
  <rect width="1024" height="1024" fill="#000" mask="url(#m)"/>
</svg>
