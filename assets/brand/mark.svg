<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- VisiScan mark: three fanned pastel visiting cards. Source for icon, adaptive icon and splash. -->
  <defs>
    <linearGradient id="peach" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD1BF"/><stop offset="1" stop-color="#FFB59A"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C2F0DA"/><stop offset="1" stop-color="#9EE6C4"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C9DBFF"/><stop offset="1" stop-color="#A9C8FF"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0.75" y2="0.55"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.6"/><stop offset="0.42" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22" result="b1"/>
      <feOffset in="b1" dy="26" result="o1"/>
      <feFlood flood-color="#231C2E" flood-opacity="0.2"/>
      <feComposite in2="o1" operator="in" result="s1"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b2"/>
      <feOffset in="b2" dy="3" result="o2"/>
      <feFlood flood-color="#231C2E" flood-opacity="0.1"/>
      <feComposite in2="o2" operator="in" result="s2"/>
      <feMerge><feMergeNode in="s1"/><feMergeNode in="s2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect x="-260" y="-160" width="520" height="320" rx="48"/></clipPath>
    <g id="face">
      <rect x="-260" y="-160" width="520" height="320" rx="48"/>
      <g clip-path="url(#card)">
        <circle cx="200" cy="140" r="130" fill="#FFFFFF" fill-opacity="0.35"/>
        <rect x="-260" y="-160" width="520" height="320" fill="url(#sheen)"/>
      </g>
      <rect x="-258" y="-158" width="516" height="316" rx="46" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="3"/>
    </g>
  </defs>
  <g filter="url(#shadow)" transform="translate(478 432) rotate(-14)"><use href="#face" fill="url(#sky)"/></g>
  <g filter="url(#shadow)" transform="translate(520 500) rotate(-3)"><use href="#face" fill="url(#mint)"/></g>
  <g filter="url(#shadow)" transform="translate(560 590) rotate(7)">
    <use href="#face" fill="url(#peach)"/>
    <rect x="-200" y="-100" width="120" height="20" rx="10" fill="#8A3F27" fill-opacity="0.55"/>
    <rect x="-200" y="-56" width="260" height="38" rx="19" fill="#3A2219" fill-opacity="0.8"/>
    <rect x="-200" y="54" width="190" height="18" rx="9" fill="#5A3426" fill-opacity="0.5"/>
    <rect x="-200" y="88" width="140" height="18" rx="9" fill="#5A3426" fill-opacity="0.5"/>
  </g>
</svg>
